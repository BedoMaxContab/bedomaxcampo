<style>
/* BedoMaxCampo: una colonna, pulsanti grandi da usare con i guanti; testata fissa con stato rete */
:root{
  --bg:#f6f3ef; --fg:#1d1a17; --muted:#6b625a; --panel:#ffffff; --line:#e2dbd3;
  --brand:#9A3412; --brand2:#C2410C; --brand-fg:#ffffff;
  --ok:#166534; --ok-bg:#dcfce7; --ko:#b91c1c; --ko-bg:#fee2e2; --warn:#92400e; --warn-bg:#fef3c7;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#171412; --fg:#f1ece6; --muted:#a99e93; --panel:#221e1b; --line:#3a332d;
  --ok:#86efac; --ok-bg:#14361f; --ko:#fca5a5; --ko-bg:#3b1414; --warn:#fcd34d; --warn-bg:#3a2a0b; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-fg);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
header .ind{border:0;background:rgba(255,255,255,.2);color:inherit;font:inherit;font-weight:700;font-size:16px;padding:8px 12px;border-radius:10px;line-height:1;cursor:pointer;white-space:nowrap}
.aiuto{background:var(--panel);border:1px dashed var(--brand2);border-radius:12px;padding:10px 12px;font-size:15px}
.aiuto b{color:var(--brand2)}
header h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rete{font-size:12px;font-weight:700;padding:4px 8px;border-radius:99px;background:rgba(255,255,255,.18);white-space:nowrap}
.rete.no{background:#facc15;color:#1d1a17}
main,header{zoom:var(--z,1)}
main{padding:14px 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:12px;max-width:760px;margin:0 auto}
.sez{display:flex;flex-direction:column;gap:10px}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:6px 0 0}
p{margin:0}
.muted{color:var(--muted);font-size:15px}
.voce{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:14px;min-height:64px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.voce:active{transform:scale(.99)}
.voce .t{flex:1;min-width:0}
.voce .t b{display:block;font-size:18px}
.voce .t span{display:block;color:var(--muted);font-size:14px}
.cnt{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;padding:6px 10px;border-radius:10px;background:var(--line);white-space:nowrap}
.cnt.tutto{background:var(--ok-bg);color:var(--ok)}
.cal{display:grid;grid-template-columns:1fr auto;gap:2px 10px;background:var(--panel);border:1px solid var(--line);border-left:8px solid var(--line);
  border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.cal.fatto{border-left-color:var(--ok)}
.cal.prob{border-left-color:var(--ko)}
.cal.altro{border-left-color:#2563eb}
.cal .loc{font-weight:700;font-size:18px}
.cal .st{font-size:13px;font-weight:700;justify-self:end;align-self:start}
.cal .mm{grid-column:1/-1;display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums}
.cal .mm i{font-style:normal;font-family:var(--sans);font-size:12px;color:var(--muted);display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;min-height:60px;padding:0 18px;
  font:inherit;font-weight:700;font-size:18px;cursor:pointer;width:100%}
.btn.pri{background:var(--brand2);color:var(--brand-fg)}
.btn.sec{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.btn.pic{min-height:46px;font-size:15px}
.btn:disabled{opacity:.5}
.foto{position:relative;overflow:hidden}
.foto input{position:absolute;inset:0;opacity:0;font-size:0;cursor:pointer}
label.campo{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--muted)}
input.txt{font:inherit;font-size:20px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);width:100%}
.esito{border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.esito.ok{background:var(--ok-bg);color:var(--ok)}
.esito.ko{background:var(--ko-bg);color:var(--ko)}
.esito.warn{background:var(--warn-bg);color:var(--warn)}
.esito b.big{font-family:var(--mono);font-size:32px;color:var(--fg);letter-spacing:.03em}
.esito .tit{font-weight:800;font-size:20px}
.dett{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.dett span{color:var(--muted);font-size:14px}
.dett b{font-family:var(--mono);font-size:19px;font-variant-numeric:tabular-nums}
.barra{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.barra i{display:block;height:100%;background:var(--ok)}
.riga{display:flex;gap:10px;flex-wrap:wrap}
.riga>*{flex:1;min-width:140px}
.avviso{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:15px}
pre.log{font-family:var(--mono);font-size:12px;white-space:pre-wrap;word-break:break-all;color:var(--muted);max-height:240px;overflow:auto;margin:0}
.attesa{display:flex;align-items:center;gap:12px;font-weight:700}
.attesa::before{content:"";width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--brand2);animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.scan{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column}
.scan video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan .guida{position:absolute;left:7%;right:7%;top:30%;height:30%;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 2000px rgba(0,0,0,.45)}
.scan .guida.ok{border-color:#4ade80}
.scan .guida.qr{left:50%;right:auto;top:50%;height:auto;width:min(70vw,70vh);aspect-ratio:1;transform:translate(-50%,-50%)}
.scan .guida.disp{top:33%;height:19%;left:5%;right:5%}
.scan .guida.lcd{top:38%;height:14%;left:12%;right:12%;border-style:dashed;box-shadow:none;transition:all .15s}
.fotodisp{width:100%;border-radius:12px;border:3px solid var(--line);display:block}
.scan .msg{position:absolute;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);color:#fff;font-weight:700;font-size:18px;text-align:center;text-shadow:0 1px 3px #000}
.scan .sotto{position:absolute;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px}
.scan .stato{color:#fff;text-align:center;font-size:15px;text-shadow:0 1px 3px #000}
@media (prefers-reduced-motion: reduce){.attesa::before{animation:none}}
</style>

<body>
<header>
  <button class="ind" id="indietro" aria-label="Indietro" hidden>&#8249; Indietro</button>
  <h1 id="titolo">BedoMaxCampo</h1>
  <button class="ind" id="zoom" aria-label="Grandezza del testo" title="Grandezza del testo">Aa</button>
  <span class="rete" id="rete">…</span>
</header>
<main id="vista"></main>

<script src="zxing-reader.js"></script>
<script src="tesseract.min.js"></script>
<script>
'use strict';
/* =====================================================================
   BedoMaxCampo 0.1 - Montanari Sicurcalor
   - lavori caricati dall'ufficio (BedoMaxBanco) nell'archivio GitHub privato "campo-dati"
   - ogni dispositivo scrive SOLO il suo file: lavori/<cond>/disp-<nome>.json  -> nessun conflitto
   - tutto resta nel dispositivo (localStorage) e si sincronizza quando c'e' rete
   ===================================================================== */
const VERSIONE = '0.11.0';
const OWNER = 'BedoMaxContab', REPO = 'campo-dati';
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ---------- grandezza del testo (pulsante "Aa" in alto): normale / grande / molto grande ---------- */
const ZOOM = [1, 1.25, 1.5, 1.8];
function applicaZoom() {
  let i = mem.get('zoom', null);
  if (i === null) { i = Math.min(screen.width, screen.height) < 600 ? 2 : 1; mem.set('zoom', i); }   // telefono: parte gia' grande
  const z = ZOOM[i] || 1;
  document.documentElement.style.setProperty('--z', z);
  for (const el of document.querySelectorAll('header, main')) { el.style.zoom = z; }
  const b = document.getElementById('zoom'); if (b) b.textContent = 'Aa' + '+'.repeat(i);
}
/* ---------- memoria locale ---------- */
const mem = {
  get(k, def) { try { const v = localStorage.getItem('bmcampo:' + k); return v == null ? def : JSON.parse(v); } catch (e) { return def; } },
  set(k, v) { try { localStorage.setItem('bmcampo:' + k, JSON.stringify(v)); return true; } catch (e) { avviso('Memoria del dispositivo piena o bloccata: ' + e.message); return false; } }
};
let cfg = mem.get('cfg', null);           // {dispositivo, token}
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'disp';
const mioFile = () => 'disp-' + slug(cfg.dispositivo) + '.json';
const percorsoCond = c => 'lavori/' + encodeURIComponent(c);

/* ---------- GitHub ---------- */
async function gh(metodo, percorso, corpo, raw) {
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 45000);    // niente attese infinite
  const r = await fetch('https://api.github.com/repos/' + OWNER + '/' + REPO + '/' + percorso, {
    method: metodo, cache: 'no-store', signal: ctl.signal,
    headers: {'Authorization': 'Bearer ' + cfg.token, 'Accept': raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28'},
    body: corpo ? JSON.stringify(corpo) : undefined }).finally(() => clearTimeout(tm));
  if (r.status === 404) return {stato: 404, dati: null};
  if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch (e) {} throw new Error('GitHub ' + r.status + (m ? ': ' + m : '')); }
  return {stato: r.status, dati: raw ? await r.text() : await r.json()};
}
const b64 = s => btoa(unescape(encodeURIComponent(s)));

/* ---------- stato rete ---------- */
function aggiornaRete() {
  const da = Object.values(mem.get('mio', {})).filter(m => m && m.sporco).length;
  const el = $('#rete');
  if (!navigator.onLine) { el.textContent = 'SENZA RETE' + (da ? ' · ' + da + ' da inviare' : ''); el.className = 'rete no'; }
  else { el.textContent = da ? da + ' da inviare' : 'in linea'; el.className = 'rete'; }
}
window.addEventListener('online', () => { aggiornaRete(); sincronizzaTutto(); });
window.addEventListener('offline', aggiornaRete);

/* ---------- dati per condominio ---------- */
// piano:  {condominio, indirizzo, caricato, righe:[{id, interno, n, locale, vecchia, nuova}]}
// mio:    {<cond>: {sha, sporco, rec:{<id>: {stato, letto, metodo, ora, nota}}}}
// altri:  {<cond>: {<file>: {dispositivo, rec:{...}}}}
const piano = c => mem.get('piano:' + c, null);
function mieiRec(c) { const m = mem.get('mio', {}); return (m[c] && m[c].rec) || {}; }
function altriRec(c) { return mem.get('altri:' + c, {}); }
function salvaRec(c, id, r) {
  const m = mem.get('mio', {}); m[c] = m[c] || {rec: {}}; m[c].rec[id] = r; m[c].sporco = true; mem.set('mio', m);
  aggiornaRete(); sincronizza(c).catch(() => {});
}
// stato visto da questo dispositivo: il mio record vince, altrimenti quello di un altro dispositivo
function statoCal(c, id) {
  const mio = mieiRec(c)[id];
  const altri = Object.values(altriRec(c)).map(a => a.rec && a.rec[id] ? Object.assign({da: a.dispositivo}, a.rec[id]) : null).filter(Boolean)
    .filter(x => x.stato !== 'annullato');
  if (mio && mio.stato !== 'annullato') return {r: mio, mio: true, doppio: altri.length > 0, altri};
  if (altri.length) return {r: altri[0], mio: false, doppio: altri.length > 1, altri};
  return null;
}

/* ---------- foto del display (IndexedDB: le foto non stanno nel localStorage) ---------- */
const fotoDB = (() => {
  let p = null;
  const db = () => p || (p = new Promise((ok, ko) => { const r = indexedDB.open('bmcampo', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('foto'); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }));
  const tx = async (modo, fn) => { const d = await db(); return new Promise((ok, ko) => {
    const t = d.transaction('foto', modo); const q = fn(t.objectStore('foto')); t.oncomplete = () => ok(q && q.result); t.onerror = () => ko(t.error); }); };
  return {put: (k, v) => tx('readwrite', st => st.put(v, k)), get: k => tx('readonly', st => st.get(k)),
          del: k => tx('readwrite', st => st.delete(k)), keys: () => tx('readonly', st => st.getAllKeys())};
})();
async function blob64(b) {
  const u = new Uint8Array(await b.arrayBuffer()); let s = '';
  for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
  return btoa(s);
}
const entro = (p, ms) => Promise.race([p, new Promise((_, ko) => setTimeout(() => ko(new Error('tempo scaduto')), ms))]);
async function inviaFoto(c) {      // foto delle sostituzioni REGISTRATE (pronta) -> lavori/<cond>/foto/<nome>
  let chiavi = []; try { chiavi = await entro(fotoDB.keys(), 10000); } catch (e) { return; }
  for (const k of chiavi) {
    const v = await entro(fotoDB.get(k), 10000);
    if (!v || v.cond !== c || !v.pronta) continue;
    await entro(gh('PUT', 'contents/' + percorsoCond(c) + '/foto/' + encodeURIComponent(v.nome),
      {message: 'foto display ' + cfg.dispositivo + ' - ' + c, content: await blob64(v.blob)}), 60000);
    await entro(fotoDB.del(k), 10000);
  }
}

/* ---------- sincronizzazione ---------- */
let inCorso = {};
async function sincronizza(c) {
  if (!navigator.onLine || !cfg || !cfg.token || (inCorso[c] && Date.now() - inCorso[c] < 90000)) return;
  inCorso[c] = Date.now();
  try {
    const p = await gh('GET', 'contents/' + percorsoCond(c) + '/piano.json', null, true);
    const m0 = mem.get('mio', {}), sporco = !!(m0[c] && m0[c].sporco);
    if (p.stato === 404 && !sporco) { dimentica(c); return; }      // lavoro tolto dall'ufficio: via anche dal dispositivo
    if (p.dati) mem.set('piano:' + c, JSON.parse(p.dati));
    const elenco = await gh('GET', 'contents/' + percorsoCond(c));
    const files = (elenco.dati || []).filter(f => /^disp-.*\.json$/.test(f.name));
    const altri = altriRec(c); let mioSha = null;
    for (const f of files) {
      if (f.name === mioFile()) { mioSha = f.sha; continue; }
      if (altri[f.name] && altri[f.name].sha === f.sha) continue;
      const t = await gh('GET', 'contents/' + percorsoCond(c) + '/' + f.name, null, true);
      const d = JSON.parse(t.dati); d.sha = f.sha; altri[f.name] = d;
    }
    mem.set('altri:' + c, altri);
    // il mio file non c'e' piu' nell'archivio (azzerato dall'ufficio) e qui non ho niente da inviare: azzero anche qui
    if (!mioSha && !sporco && m0[c] && Object.keys(m0[c].rec || {}).length && Date.now() - (m0[c].inviato || 0) > 600000) {   // 10 min di margine dall'ultimo invio
      const mm = mem.get('mio', {}); mm[c] = {rec: {}}; mem.set('mio', mm); pulisciPassi(c);
    }
    const m = mem.get('mio', {});
    if (m[c] && m[c].sporco) {
      const corpo = {dispositivo: cfg.dispositivo, condominio: c, aggiornato: new Date().toISOString(), versione_app: VERSIONE, rec: m[c].rec};
      const put = await gh('PUT', 'contents/' + percorsoCond(c) + '/' + mioFile(),
        Object.assign({message: 'campo ' + cfg.dispositivo + ' - ' + c, content: b64(JSON.stringify(corpo, null, 1))}, mioSha ? {sha: mioSha} : {}));
      const m2 = mem.get('mio', {}); m2[c].sha = put.dati.content.sha; m2[c].inviato = Date.now();
      if (JSON.stringify(m2[c].rec) === JSON.stringify(corpo.rec)) m2[c].sporco = false;   // modifiche nel frattempo: resta da inviare
      mem.set('mio', m2);
    }
    mem.set('ultimaSync:' + c, Date.now());
    inviaFoto(c).catch(e => console.warn('foto', e));
  } finally { inCorso[c] = 0; aggiornaRete(); }
}
// lavoro tolto dall'ufficio (piano.json cancellato): tolgo dal dispositivo piano, registrazioni, passi a meta' e foto
function pulisciPassi(c) {
  try { Object.keys(localStorage).filter(k => k.startsWith('bmcampo:vecchio:' + c + ':')).forEach(k => localStorage.removeItem(k)); } catch (e) {}
  fotoDB.keys().then(kk => kk.filter(k => String(k).startsWith(c + '|')).forEach(k => fotoDB.del(k))).catch(() => {});
}
function dimentica(c) {
  const m = mem.get('mio', {}); delete m[c]; mem.set('mio', m);
  try { ['piano:', 'altri:', 'ultimaSync:'].forEach(p => localStorage.removeItem('bmcampo:' + p + c)); } catch (e) {}
  pulisciPassi(c);
}
/* dispositivi.json (scritto da BedoMaxBanco "TABLET AUTORIZZATI"): {dispositivi:[{nome, slug, creato, scadenza, stato}]}
   stato 'revocato' -> questo dispositivo cancella la sua chiave e si ferma. Scadenza -> avviso 15 giorni prima. */
async function controllaDispositivo() {
  const d = await gh('GET', 'contents/dispositivi.json', null, true);
  if (!d.dati) return;
  const io = (JSON.parse(d.dati).dispositivi || []).find(x => x.slug === slug(cfg.dispositivo));
  mem.set('mioDisp', io || null);
  if (io && io.stato === 'revocato') {
    cfg = {dispositivo: cfg.dispositivo, token: ''}; mem.set('cfg', cfg); mem.set('revocato', io.revocato || 'sì');
    pila = []; vai(vistaSetup);
    throw new Error('dispositivo disattivato dall\'ufficio');
  }
}
function messaggioErrore(err) {
  const m = String(err && err.message || err);
  if (/GitHub 401/.test(m)) return 'La chiave di accesso non è più valida (scaduta o eliminata). Chiedi all’ufficio un nuovo QR: Dispositivo → cambia → Configura con QR.';
  if (/GitHub 403|GitHub 404/.test(m)) return 'La chiave non ha accesso all’archivio dei lavori. Chiedi all’ufficio un nuovo QR.';
  if (/abort|Failed to fetch|Load failed|NetworkError/i.test(m)) return 'Rete assente o troppo lenta: riprovo da solo appena c’è campo.';
  return m;
}
let ultimaTutto = 0;
async function sincronizzaTutto() {
  if (!navigator.onLine || !cfg || !cfg.token) return;
  ultimaTutto = Date.now();
  try {
    await controllaDispositivo();
    const e = await gh('GET', 'contents/lavori/elenco.json', null, true);
    if (e.dati) mem.set('elenco', JSON.parse(e.dati));
    mem.set('erroreSync', null); mem.set('ultimoElenco', Date.now());
  } catch (err) {
    console.warn(err); mem.set('erroreSync', messaggioErrore(err));
    if (/disattivato/.test(err.message)) return;
  }
  for (const c of Object.keys(mem.get('mio', {}))) { try { await sincronizza(c); } catch (err) { console.warn(err); } }
  if (vistaAttuale && vistaAttuale.ridisegna) vistaAttuale.ridisegna();
}
setInterval(() => { if (document.visibilityState === 'visible') sincronizzaTutto(); }, 90000);
// app riaperta o tornata in primo piano: aggiorno subito l'elenco (non piu' di una volta ogni 20 s)
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - ultimaTutto > 20000) sincronizzaTutto();
});

/* ---------- lettore etichetta (zxing-cpp WebAssembly, funziona offline) ---------- */
let motore = null;
function preparaMotore() {
  if (!motore) motore = fetch('zxing_reader.wasm').then(r => { if (!r.ok) throw new Error('motore HTTP ' + r.status); return r.arrayBuffer(); })
    .then(buf => ZXingWASM.prepareZXingModule({overrides: {wasmBinary: buf}, fireImmediately: true}))
    .catch(e => { motore = null; throw e; });
  return motore;
}
function matricolaDa(testo) {
  const t = String(testo), ds = t.match(/43S(\d{8})/);       // Data Matrix Siemens: ...+43S<matricola>
  if (ds) return ds[1];
  const s = t.replace(/\s/g, '');
  return /^\d{8}$/.test(s) ? s : null;                       // codice a barre: le sole 8 cifre
}
async function leggiEtichetta(file) {
  await preparaMotore();
  const opz = {tryHarder: true, formats: ['DataMatrix', 'Code128', 'ITF', 'Code39'], maxNumberOfSymbols: 4};
  let ris = (await ZXingWASM.readBarcodes(file, opz)).filter(r => r.isValid);
  if (!ris.length) {   // seconda prova: foto ridotta (a volte aiuta con le foto molto grandi)
    const img = await createImageBitmap(file); const k = Math.min(1, 1600 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
    const g = c.getContext('2d'); g.drawImage(img, 0, 0, c.width, c.height);
    ris = (await ZXingWASM.readBarcodes(g.getImageData(0, 0, c.width, c.height), opz)).filter(r => r.isValid);
  }
  const matr = [...new Set(ris.map(r => matricolaDa(r.text)).filter(Boolean))];
  return {matr, codici: ris.map(r => r.format + ': ' + r.text)};
}

/* ---------- lettura del NUMERO stampato (OCR) quando i codici non si leggono ----------
   Tesseract (WebAssembly) tenuto nell'app: funziona anche senza rete. Usato solo come ripiego:
   conta come GIUSTO solo se tra i numeri letti c'e' esattamente la matricola attesa. */
let ocrWorker = null;
function preparaOcr() {
  if (!ocrWorker) ocrWorker = (async () => {
    const base = new URL('./', location.href).href;
    const w = await Tesseract.createWorker('eng', 1, {workerPath: base + 'worker.min.js', corePath: base, langPath: base.replace(/\/$/, ''), gzip: true});
    await w.setParameters({tessedit_char_whitelist: '0123456789 ', tessedit_pageseg_mode: '11'});
    return w;
  })().catch(e => { ocrWorker = null; throw e; });
  return ocrWorker;
}
function tela(img, k, contrasto) {
  const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(img, 0, 0, c.width, c.height);
  if (contrasto) {   // grigio + allungamento del contrasto (etichette opache, foto scure)
    const d = g.getImageData(0, 0, c.width, c.height), a = d.data; let mn = 255, mx = 0;
    for (let i = 0; i < a.length; i += 4) { const v = a[i] * .3 + a[i + 1] * .59 + a[i + 2] * .11; a[i] = v; if (v < mn) mn = v; if (v > mx) mx = v; }
    const f = 255 / Math.max(1, mx - mn);
    for (let i = 0; i < a.length; i += 4) { const v = (a[i] - mn) * f; a[i] = a[i + 1] = a[i + 2] = v; }
    g.putImageData(d, 0, 0);
  }
  return c;
}
const distanza = (a, b) => { let n = 0; for (let i = 0; i < 8; i++) if (a[i] !== b[i]) n++; return n; };
async function leggiNumeri(file, atteso) {
  const w = await preparaOcr();
  const img = await createImageBitmap(file); const lato = Math.max(img.width, img.height);
  const passi = [[Math.min(1, 2000 / lato), false], [Math.min(1, 2000 / lato), true]];
  if (lato < 1400) passi.push([Math.min(3, 2000 / lato), true]);   // foto piccola/ritagliata: ingrandisco
  const cand = new Set(); let compatto = '';
  for (const [k, ctr] of passi) {
    const {data} = await w.recognize(tela(img, k, ctr));
    const testo = data.text || ''; compatto += '|' + testo.replace(/\s+/g, '');
    (testo.match(/\d[\d ]{6,12}\d/g) || []).map(t => t.replace(/ /g, ''))
      .forEach(t => (t.length === 8 ? [t] : t.length > 8 ? (t.match(/\d{8}/g) || []) : []).forEach(x => cand.add(x)));
    if (atteso && compatto.includes(atteso)) break;
  }
  return {cand: [...cand], compatto};
}

/* ---------- inquadratura dal vivo: legge di continuo finche' trova la matricola ----------
   Ogni ~150 ms prova Data Matrix / codice a barre sul riquadro; ogni ~1,2 s prova anche il numero stampato (OCR).
   Risolve con {matr:[..], metodo} oppure null se l'operatore annulla. */
async function apriScanner(atteso, note) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('questo browser non da\' accesso alla fotocamera');
  await preparaMotore();
  preparaOcr().catch(() => {});
  const stream = await navigator.mediaDevices.getUserMedia({audio: false,
    video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1080}}});
  const ov = document.createElement('div'); ov.className = 'scan';
  ov.innerHTML = `<video playsinline muted autoplay></video><div class="guida"></div>
    <div class="msg">Metti l'etichetta del ripartitore NUOVO dentro il riquadro</div>
    <div class="sotto"><div class="stato">Cerco la matricola…</div>
      <div class="riga"><button class="btn sec" id="torcia" hidden>Torcia</button><button class="btn sec" id="annScan">Annulla</button></div></div>`;
  document.body.appendChild(ov);
  const video = ov.querySelector('video'), guida = ov.querySelector('.guida'), stato = ov.querySelector('.stato');
  video.srcObject = stream; try { await video.play(); } catch (e) {}
  const traccia = stream.getVideoTracks()[0];
  try {
    const cap = traccia.getCapabilities ? traccia.getCapabilities() : {};
    if (cap.torch) { const t = ov.querySelector('#torcia'); t.hidden = false; let acc = false;
      t.onclick = () => { acc = !acc; traccia.applyConstraints({advanced: [{torch: acc}]}).catch(() => {}); }; }
  } catch (e) {}
  const tela = document.createElement('canvas'), g = tela.getContext('2d', {willReadFrequently: true});
  const opz = {tryHarder: true, formats: ['DataMatrix', 'Code128', 'ITF', 'Code39'], maxNumberOfSymbols: 2};
  let finito = false, ocrOcc = false, ultimoOcr = 0; const t0 = Date.now();
  return new Promise(risolvi => {
    const chiudi = v => { if (finito) return; finito = true; stream.getTracks().forEach(t => t.stop()); ov.remove(); risolvi(v); };
    ov.querySelector('#annScan').onclick = () => chiudi(null);
    const riquadro = () => {   // riquadro guida (schermo) -> pixel del video (object-fit: cover)
      const vw = video.videoWidth, vh = video.videoHeight, W = ov.clientWidth, H = ov.clientHeight;
      const k = Math.max(W / vw, H / vh), ox = (W - vw * k) / 2, oy = (H - vh * k) / 2, b = guida.getBoundingClientRect();
      const x = Math.max(0, (b.left - ox) / k), y = Math.max(0, (b.top - oy) / k);
      return [x, y, Math.min(vw - x, b.width / k), Math.min(vh - y, b.height / k)];
    };
    const giro = async () => {
      if (finito) return;
      try {
        if (video.readyState >= 2 && video.videoWidth) {
          const [x, y, w, h] = riquadro(); const sc = Math.min(1, 1400 / w);
          tela.width = Math.round(w * sc); tela.height = Math.round(h * sc);
          g.drawImage(video, x, y, w, h, 0, 0, tela.width, tela.height);
          const ris = (await ZXingWASM.readBarcodes(g.getImageData(0, 0, tela.width, tela.height), opz)).filter(q => q.isValid);
          const m = [...new Set(ris.map(q => matricolaDa(q.text)).filter(Boolean))];
          if (m.length) { guida.classList.add('ok'); if (navigator.vibrate) navigator.vibrate(60); return chiudi({matr: m, metodo: 'video'}); }
          if (!ocrOcc && ocrWorker && Date.now() - ultimoOcr > 1200) {
            ocrOcc = true; ultimoOcr = Date.now();
            const copia = document.createElement('canvas'); copia.width = tela.width; copia.height = tela.height; copia.getContext('2d').drawImage(tela, 0, 0);
            ocrWorker.then(w2 => w2.recognize(copia)).then(({data}) => {
              const comp = (data.text || '').replace(/\s+/g, '');
              if (comp.includes(atteso)) { guida.classList.add('ok'); chiudi({matr: [atteso], metodo: 'numero'}); return; }
              const altro = note.find(n => n !== atteso && comp.includes(n));
              if (altro) chiudi({matr: [altro], metodo: 'numero'});
            }).catch(() => {}).finally(() => { ocrOcc = false; });
          }
          const sec = Math.round((Date.now() - t0) / 1000);
          if (sec > 10) stato.textContent = 'Non riesco ancora: avvicina o allontana un poco, evita i riflessi' + (sec > 25 ? ', oppure Annulla e scrivi la matricola a mano' : '');
        }
      } catch (e) { stato.textContent = 'Errore lettore: ' + e.message; }
      setTimeout(giro, 150);
    };
    giro();
  });
}

/* ---------- QR di configurazione (BedoMaxBanco > TABLET AUTORIZZATI): "BMCAMPO1|<nome>|<chiave>" ---------- */
function leggiQrConfig(t) {
  const p = String(t || '').split('|');
  return p.length === 3 && p[0] === 'BMCAMPO1' && p[1].trim() && /^github_pat_\w{20,}$/.test(p[2].trim()) ? {dispositivo: p[1].trim(), token: p[2].trim()} : null;
}
async function scannerQr() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('questo browser non da\' accesso alla fotocamera');
  await preparaMotore();
  const stream = await navigator.mediaDevices.getUserMedia({audio: false, video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}});
  const ov = document.createElement('div'); ov.className = 'scan';
  ov.innerHTML = `<video playsinline muted autoplay></video><div class="guida qr"></div>
    <div class="msg">Inquadra il QR che l’ufficio mostra sullo schermo di BedoMaxBanco</div>
    <div class="sotto"><div class="stato">Cerco il QR…</div><button class="btn sec" id="annQr">Annulla</button></div>`;
  document.body.appendChild(ov);
  const video = ov.querySelector('video'), stato = ov.querySelector('.stato'), guida = ov.querySelector('.guida');
  video.srcObject = stream; try { await video.play(); } catch (e) {}
  const tela = document.createElement('canvas'), g = tela.getContext('2d', {willReadFrequently: true});
  const opz = {tryHarder: true, formats: ['QRCode'], maxNumberOfSymbols: 1};
  let finito = false;
  return new Promise(risolvi => {
    const chiudi = v => { if (finito) return; finito = true; stream.getTracks().forEach(t => t.stop()); ov.remove(); risolvi(v); };
    ov.querySelector('#annQr').onclick = () => chiudi(null);
    const giro = async () => {
      if (finito) return;
      try {
        if (video.readyState >= 2 && video.videoWidth) {
          const sc = Math.min(1, 1280 / Math.max(video.videoWidth, video.videoHeight));
          tela.width = Math.round(video.videoWidth * sc); tela.height = Math.round(video.videoHeight * sc);
          g.drawImage(video, 0, 0, tela.width, tela.height);
          const ris = (await ZXingWASM.readBarcodes(g.getImageData(0, 0, tela.width, tela.height), opz)).filter(q => q.isValid);
          for (const q of ris) {
            const conf = leggiQrConfig(q.text);
            if (conf) { guida.classList.add('ok'); if (navigator.vibrate) navigator.vibrate(60); return chiudi(conf); }
            stato.textContent = 'Questo QR non è quello di BedoMaxBanco.';
          }
        }
      } catch (e) { stato.textContent = 'Errore lettore: ' + e.message; }
      setTimeout(giro, 200);
    };
    giro();
  });
}

let vistaAttuale = null, pila = [];
function vai(v, ...arg) { pila.push([v, arg]); mostra(v, arg); }
function indietro() { pila.pop(); const [v, arg] = pila[pila.length - 1] || [vistaLavori, []]; mostra(v, arg); }

function una(el, fn) {

}
// prossimo calorifero ancora da fare (nell'ordine del piano, dopo quello attuale)
function prossimoDaFare(c, id) {
  const rr = piano(c).righe; const i = rr.findIndex(x => x.id === id);
  for (let k = 1; k <= rr.length; k++) { const x = rr[(i + k) % rr.length]; if (x.id !== id && !statoCal(c, x.id)) return x; }
  return null;
}
// apre il calorifero x tenendo giusto il tasto Indietro (condominio > interno > calorifero)
function apriCalorifero(c, x, daCalorifero) {
  if (daCalorifero) pila.pop();
  const top = pila[pila.length - 1];
  if (!(top && top[0] === vistaInterno && top[1][1] === x.interno)) {
    if (top && top[0] === vistaInterno) pila.pop();
    pila.push([vistaInterno, [c, x.interno]]);
  }
  vai(vistaCalorifero, c, x.id);
}

  while (pila.length > 1 && pila[pila.length - 1][0] !== vista) pila.pop();
  const [v, arg] = pila[pila.length - 1]; mostra(v, arg);
}

        <span class="cnt ${f === i.righe.length ? 'tutto' : ''}">${pr ? '⚠ ' : ''}${f}/${i.righe.length}</span>`;
      b.onclick = () => vai(vistaInterno, c, i.interno);
      $('#int').appendChild(b);
    });
  };
  disegna(); sincronizza(c).then(disegna).catch(() => {});
  return {ridisegna: disegna};
}

function vistaInterno(c, interno) {
  $('#titolo').textContent = c + ' · int. ' + interno;
  const disegna = () => {
    const righe = piano(c).righe.filter(r => r.interno === interno);
    $('#vista').innerHTML = '<div class="aiuto"><b>Tocca il calorifero su cui lavori.</b> Per ognuno: <b>1°</b> inquadra il VECCHIO ancora montato · <b>2°</b> toglilo e monta il NUOVO · <b>3°</b> inquadra il NUOVO. Poi “Avanti” ti porta al prossimo.</div><div class="sez" id="cal"></div>';
    righe.forEach(r => {
      const s = statoCal(c, r.id);
      const cls = !s ? '' : (s.r.stato === 'problema' || s.doppio) ? 'prob' : s.mio ? 'fatto' : 'altro';
      const st = !s ? 'da fare' : s.r.stato === 'problema' ? 'PROBLEMA' : s.doppio ? 'DOPPIO' : s.mio ? 'fatto ✓' : 'fatto da ' + s.r.da;
      const b = document.createElement('button'); b.className = 'cal ' + cls;
      b.innerHTML = `<span class="loc">${r.n}. ${esc(r.locale)}</span><span class="st">${esc(st)}</span>
        <span class="mm"><span><i>togli</i>${esc(r.vecchia)}</span><span><i>monta</i><b>${esc(r.nuova)}</b></span></span>`;
      b.onclick = () => vai(vistaCalorifero, c, r.id);
      $('#cal').appendChild(b);
    });
  };
  disegna();
  return {ridisegna: disegna};
}

function vistaCalorifero(c, id) {
  const p = piano(c), r = p.righe.find(x => x.id === id);
  $('#titolo').textContent = 'Int. ' + r.interno + ' · ' + r.locale;
  const disegna = (esitoHtml) => {
    const s = statoCal(c, id);
    $('#vista').innerHTML = `
      <div class="dett">
        <span>Calorifero</span><b style="font-family:var(--sans)">${r.n}. ${esc(r.locale)}</b>
        <span>Togli il vecchio</span><b>${esc(r.vecchia)}</b>
        <span>Monta il nuovo</span><b>${esc(r.nuova)}</b>
      </div>
      ${s ? `<div class="esito ${s.r.stato === 'problema' || s.doppio ? 'ko' : 'ok'}"><span class="tit">${s.r.stato === 'problema' ? 'Segnato con PROBLEMA' : 'Già sostituito'}${s.mio ? '' : ' da ' + esc(s.r.da)}</span>
        letto ${esc(s.r.letto || '-')} · ${s.r.metodo === 'manuale' ? 'inserito a mano' : s.r.metodo && s.r.metodo.startsWith('numero') ? 'dal numero stampato' + (s.r.metodo.includes('conf') ? ' (confermato)' : '') : 'letto dalla fotocamera'} · ${new Date(s.r.ora).toLocaleString('it-IT')}
        ${s.r.vecchio_ok === false ? '<br>⚠ vecchio non verificato: ' + esc(s.r.vecchio_nota || '') : s.r.vecchio_ok ? '<br>vecchio verificato ' + esc(s.r.vecchio_letto || '') : ''}
        ${s.r.nota ? '<br>' + esc(s.r.nota) : ''}${s.doppio ? '<br><b>Attenzione: risulta fatto anche da ' + esc(s.altri.map(a => a.da).join(', ')) + '</b>' : ''}</div>` : ''}
      <div id="esito">${esitoHtml || ''}</div>
      ${s ? dopoHtml() : ''}
      ${!s && !p1() ? `<div class="esito warn"><span class="tit">1° passo: il VECCHIO</span>Prima di toglierlo, inquadra il ripartitore VECCHIO ancora montato su questo calorifero (deve essere ${esc(r.vecchia)}).</div>
      <button class="btn pri" id="inqV">📷 Inquadra il ripartitore VECCHIO</button>
      <button class="btn sec pic" id="manoV">⌨ Scrivi la matricola del vecchio</button>
      <button class="btn sec pic" id="saltaV">Il vecchio manca o è illeggibile</button>` : `
      ${!s ? testoP1() + `<div class="esito warn"><span class="tit">Ora togli il vecchio e monta il NUOVO ${esc(r.nuova)}</span>Il vecchio smontato resta al cliente.</div>` : ''}
      <button class="btn ${s ? 'sec' : 'pri'}" id="inquadra">📷 ${s ? 'Rileggi il ripartitore nuovo montato' : '2° passo: inquadra il NUOVO montato'}</button>
      <label class="btn sec pic foto" for="scatto">Scatta una foto (se l'inquadratura non legge)
        <input id="scatto" type="file" accept="image/*" capture="environment"></label>
      <button class="btn sec" id="mano" style="flex-direction:column;gap:2px;padding-block:8px">⌨ Scrivi la matricola a mano<small style="font-weight:400;font-size:14px">fotocamera guasta o etichetta illeggibile</small></button>
      ${s && s.mio ? '<button class="btn sec pic" id="annulla">Annulla questa sostituzione</button>' : ''}`}
      ${!s && p1() ? '<button class="btn sec pic" id="rifaiV">Rifai il 1° passo (vecchio)</button>' : ''}`;
    if (s) collegaDopo();
    if ($('#inqV')) { passo1Comandi(); return; }
    if ($('#rifaiV')) $('#rifaiV').onclick = () => { mem.set(kP1, null); disegna(); };
    $('#scatto').onchange = async e => {
      const f = e.target.files && e.target.files[0]; if (!f) return;
      $('#esito').innerHTML = '<div class="attesa">Leggo l’etichetta…</div>';
      try {
        const l = await leggiEtichetta(f);
        if (l.matr.length) { valuta(l.matr, 'foto', l.codici); return; }
        $('#esito').innerHTML = '<div class="attesa">Codici non leggibili: leggo il numero stampato…</div>';
        const o = await leggiNumeri(f, r.nuova);
        if (o.compatto.includes(r.nuova)) { valuta([r.nuova], 'numero', []); return; }
        const noti = o.cand.filter(x => p.righe.some(y => y.nuova === x || y.vecchia === x));
        if (noti.length) { valuta([noti[0]], 'numero', []); return; }
        // lettura quasi giusta (1-2 cifre sbagliate dall'OCR) e piu' vicina all'atteso che a ogni altra matricola del lavoro
        const tutte = p.righe.flatMap(y => [y.nuova, y.vecchia]);
        const vicino = o.cand.find(x => distanza(x, r.nuova) <= 2 && tutte.every(t => t === r.nuova || distanza(x, t) > distanza(x, r.nuova)));
        if (vicino) {
          $('#esito').innerHTML = `<div class="esito warn"><span class="tit">Controlla il numero</span>
            Ho letto <b>${esc(vicino)}</b>: sull'etichetta c'e' scritto <b class="big">${esc(r.nuova)}</b>?
            <div class="riga"><button class="btn sec pic" id="nonc">No, è diverso</button><button class="btn pri pic" id="conf">Sì, è questo</button></div></div>`;
          una($('#conf'), () => valuta([r.nuova], 'numero confermato', []));
          $('#nonc').onclick = () => valuta([], 'numero', ['numeri letti: ' + o.cand.join(', ')]);
          return;
        }
        valuta([], 'numero', o.cand.length ? ['numeri letti: ' + o.cand.join(', ')] : []);
      }
      catch (err) { $('#esito').innerHTML = '<div class="esito ko"><span class="tit">Errore del lettore</span>' + esc(err.message) +
        '<button class="btn sec pic" id="mano2">Scrivi la matricola a mano</button></div>'; $('#mano2').onclick = () => document.getElementById('mano').click(); }
    };
    $('#mano').onclick = () => aMano();
    una($('#inquadra'), async () => {
      $('#esito').innerHTML = '';
      try {
        const res = await apriScanner(r.nuova, p.righe.flatMap(y => [y.nuova, y.vecchia]));
        if (res) valuta(res.matr, res.metodo, []);
      } catch (err) {
        $('#esito').innerHTML = '<div class="esito ko"><span class="tit">Fotocamera non disponibile</span>' + esc(err.message || err) +
          '<br>Usa "Scatta una foto" oppure scrivi la matricola a mano. Se hai negato il permesso alla fotocamera, riattivalo nelle impostazioni.</div>';
      }
    });
    const aMano = () => {
      $('#esito').innerHTML = `<div class="sez"><label class="campo" for="mm">Matricola del ripartitore montato (8 cifre)
        <input class="txt" id="mm" inputmode="numeric" maxlength="8" autocomplete="off"></label>
        <button class="btn pri pic" id="ok">Controlla</button></div>`;
      $('#mm').focus();
      una($('#ok'), () => { const v = $('#mm').value.replace(/\D/g, ''); if (v.length !== 8) { $('#mm').focus(); return; } valuta([v], 'manuale', []); });
    };
    if ($('#annulla')) $('#annulla').onclick = () => {
      $('#esito').innerHTML = '<div class="esito warn"><span class="tit">Annullare la sostituzione registrata?</span><div class="riga"><button class="btn sec pic" id="no">No</button><button class="btn pri pic" id="si">Sì, annulla</button></div></div>';
      $('#no').onclick = () => disegna(); una($('#si'), () => { salvaRec(c, id, {stato: 'annullato', ora: new Date().toISOString()}); disegna(); });
    };
  };
  function dopoHtml() {
    const nx = prossimoDaFare(c, id);
    return (nx ? `<button class="btn pri" id="avanti" style="flex-direction:column;gap:2px;padding-block:8px">Avanti ➜ prossimo calorifero<small style="font-weight:400;font-size:15px">int. ${esc(nx.interno)} · ${nx.n}. ${esc(nx.locale)}</small></button>`
      : '<div class="esito ok"><span class="tit">Condominio finito: tutti i ripartitori sono stati sostituiti ✓</span></div>') +
      `<div class="riga"><button class="btn sec pic" id="aInt">↩ Caloriferi int. ${esc(r.interno)}</button><button class="btn sec pic" id="aCond">↩ Condominio</button></div>`;
  }
  function collegaDopo() {
    const nx = prossimoDaFare(c, id);
    if ($('#avanti') && nx) $('#avanti').onclick = () => apriCalorifero(c, nx, true);
    if ($('#aInt')) $('#aInt').onclick = () => { pila.pop(); const t = pila[pila.length - 1]; if (!(t && t[0] === vistaInterno)) pila.push([vistaInterno, [c, r.interno]]); tornaA(vistaInterno); };
    if ($('#aCond')) $('#aCond').onclick = () => tornaA(vistaCondominio);
  }
  const kP1 = 'vecchio:' + c + ':' + id, kFoto = c + '|' + id;
  function testoP1() {
    const v = p1();
    return `<div class="esito ${v.saltato ? 'warn' : 'ok'}"><span class="tit">1° passo ${v.saltato ? '⚠ vecchio NON verificato' : '✓ vecchio verificato'}</span>${v.saltato ? esc(v.motivo) + ' — l\u2019ufficio dovrà controllare' : esc(v.letto) + ' è il ripartitore di questo calorifero'}</div>`;
  }
  // dopo la foto: il numero lo scrive il tecnico guardando il display (o la foto)
  // consumo del vecchio aggiunto DOPO (sostituzione gia' registrata senza consumo)
  const p1 = () => mem.get(kP1, null);
  function passo1Comandi() {
    una($('#inqV'), async () => {
      try {
        const res = await apriScanner(r.vecchia, p.righe.flatMap(y => [y.nuova, y.vecchia]));
        if (res) valutaVecchio(res.matr, res.metodo);
      } catch (err) { $('#esito').innerHTML = '<div class="esito ko"><span class="tit">Fotocamera non disponibile</span>' + esc(err.message || err) + '</div>'; }
    });
    $('#manoV').onclick = () => {
      $('#esito').innerHTML = `<div class="sez"><label class="campo" for="mv">Matricola del ripartitore VECCHIO (8 cifre)
        <input class="txt" id="mv" inputmode="numeric" maxlength="8" autocomplete="off"></label><button class="btn pri pic" id="okv">Controlla</button></div>`;
      $('#mv').focus();
      una($('#okv'), () => { const v = $('#mv').value.replace(/\D/g, ''); if (v.length !== 8) { $('#mv').focus(); return; } valutaVecchio([v], 'manuale'); });
    };
    $('#saltaV').onclick = () => {
      $('#esito').innerHTML = `<div class="esito warn"><span class="tit">Perché non si può verificare il vecchio?</span>
        <div class="sez"><button class="btn sec pic" data-m="ripartitore vecchio MANCANTE sul calorifero">Manca, non c'è</button>
        <button class="btn sec pic" data-m="etichetta del vecchio ILLEGGIBILE">Etichetta illeggibile</button>
        <button class="btn sec pic" data-m="ripartitore vecchio ROTTO o staccato">Rotto o staccato</button></div></div>`;
      document.querySelectorAll('#esito [data-m]').forEach(b => b.onclick = () => { mem.set(kP1, {saltato: true, motivo: b.dataset.m, ora: new Date().toISOString()}); disegna(); });
    };
  }
  function valutaVecchio(matr, metodo) {
    if (matr.includes(r.vecchia)) {
      mem.set(kP1, {letto: r.vecchia, metodo, ora: new Date().toISOString()});
      if (navigator.vibrate) navigator.vibrate(80);
      disegna(); return;
    }
    const m = matr[0]; if (navigator.vibrate) navigator.vibrate([300, 120, 300]);
    const suo = p.righe.find(x => x.vecchia === m), nuovo = p.righe.find(x => x.nuova === m);
    let msg = 'Questa matricola non è nel lavoro di questo condominio: controlla di essere nell\u2019appartamento giusto.';
    if (suo) msg = `Questo è il vecchio di <b>int. ${esc(suo.interno)} · ${esc(suo.locale)}</b>: sei sul calorifero sbagliato.`;
    else if (nuovo) msg = 'Questo è un ripartitore NUOVO: inquadra quello vecchio ancora montato.';
    $('#esito').innerHTML = `<div class="esito ko"><span class="tit">VECCHIO SBAGLIATO ✗</span><b class="big">${esc(m)}</b><span>${msg}</span>
      ${suo && suo.id !== id ? '<button class="btn pri pic" id="vaiAltro">Vai a int. ' + esc(suo.interno) + ' · ' + esc(suo.locale) + '</button>' : ''}</div>`;
    if ($('#vaiAltro')) $('#vaiAltro').onclick = () => { pila.pop(); vai(vistaCalorifero, c, suo.id); };
  }
  function datiVecchio() {
    const v = p1();
    if (!v) return {vecchio_ok: false, vecchio_nota: 'passo del vecchio non fatto'};
    return v.saltato ? {vecchio_ok: false, vecchio_nota: v.motivo} : {vecchio_ok: true, vecchio_letto: v.letto, vecchio_metodo: v.metodo};
  }
  async function fotoPronta(rec) {     // la foto del display parte solo per una sostituzione registrata
    try { const v = await fotoDB.get(kFoto); if (!v) return;
      v.pronta = true; await fotoDB.put(kFoto, v);
      const m = mem.get('mio', {}); if (m[c] && m[c].rec[id]) { m[c].rec[id].foto_display = 'foto/' + v.nome; m[c].sporco = true; mem.set('mio', m); }
      sincronizza(c).catch(() => {}); setTimeout(() => sincronizza(c).catch(() => {}), 5000);
    } catch (e) { console.warn('foto', e); }
  }
  function valuta(matr, metodo, codici) {
    const out = $('#esito');
    if (!matr.length) {
      out.innerHTML = '<div class="esito ko"><span class="tit">Nessuna matricola letta</span>Rifai la foto più vicino, a fuoco e senza riflessi, oppure scrivila a mano.' +
        (codici.length ? '<br><small>' + esc(codici.join(' | ')) + '</small>' : '') +
        '<button class="btn sec pic" id="mano2">Scrivi la matricola a mano</button></div>';
      $('#mano2').onclick = () => document.getElementById('mano').click();
      return;
    }
    const m = matr.includes(r.nuova) ? r.nuova : matr[0];
    if (m === r.nuova) {
      salvaRec(c, id, Object.assign({stato: 'posato', letto: m, metodo, ora: new Date().toISOString(), nota: ''}, datiVecchio()));
      fotoPronta(); mem.set(kP1, null);
      if (navigator.vibrate) navigator.vibrate(80);
      disegna(`<div class="esito ok"><span class="tit">Giusto ✓ registrato</span><b class="big">${esc(m)}</b><span>è il ripartitore previsto per questo calorifero.</span></div>`);
      return;
    }
    if (navigator.vibrate) navigator.vibrate([300, 120, 300]);
    const altro = p.righe.find(x => x.nuova === m);
    const vecchio = p.righe.find(x => x.vecchia === m);
    let msg = '';
    if (altro) msg = `Questo è il ripartitore preparato per <b>int. ${esc(altro.interno)} · ${esc(altro.locale)}</b>. Prendi quello giusto: ${esc(r.nuova)}.`;
    else if (m === r.vecchia) msg = 'Hai fotografato il ripartitore VECCHIO. Fotografa quello nuovo montato.';
    else if (vecchio) msg = `È un ripartitore VECCHIO (int. ${esc(vecchio.interno)} · ${esc(vecchio.locale)}).`;
    else msg = 'Questa matricola non è nel lavoro di questo condominio.';
    out.innerHTML = `<div class="esito ko"><span class="tit">SBAGLIATO ✗</span><b class="big">${esc(m)}</b><span>${msg}</span>
      <div class="riga"><button class="btn sec pic" id="forza">Montato comunque: segna PROBLEMA</button></div></div>`;
    una($('#forza'), () => {
      salvaRec(c, id, Object.assign({stato: 'problema', letto: m, metodo, ora: new Date().toISOString(), nota: 'montato ' + m + ' invece di ' + r.nuova}, datiVecchio()));
      fotoPronta(); mem.set(kP1, null);
      disegna('<div class="esito warn"><span class="tit">Segnato con PROBLEMA</span>L’ufficio vedrà la differenza.</div>');
    });
  }
  disegna();
  return {ridisegna: () => {}};
}

/* ---------- avvio ---------- */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(e => console.warn('sw', e));
preparaMotore().catch(e => console.warn('motore', e));
applicaZoom(); aggiornaRete();
if (!cfg || !cfg.token) vai(vistaSetup); else { vai(vistaLavori); sincronizzaTutto(); }
</script>
</body>
</html>
